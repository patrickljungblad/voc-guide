<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {margin:0; font:15px/1.5 system-ui,sans-serif; color:#173b4c; background:transparent;}
.controls {display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:8px 0;}
button,select {font:inherit; color:#126557; border:1px solid #c7e0d8; border-radius:10px; background:#f1f9f6; padding:7px 10px; cursor:pointer;}
button:focus-visible,select:focus-visible {outline:3px solid #2563eb; outline-offset:2px;}
button:disabled {opacity:.5; cursor:default;}
.status {font-size:12px; color:#475569; min-height:22px; margin:4px 0 10px;}
table {width:100%; table-layout:fixed; border-collapse:collapse;}
th {text-align:left; background:#e8f3f6; padding:14px; font-size:13px; color:#356375;}
td {padding:14px; border-bottom:1px solid #e5edf2; vertical-align:top; overflow-wrap:anywhere; background:#fff;}
tbody tr:nth-child(even) td {background:#f7fafc;}
tbody tr:hover td {background:#edf8f3;}
.term {display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:4px;}
.term button {padding:4px 8px; font-size:13px;}
.single {display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
@media(max-width:450px) {body {font-size:14px;} th,td {padding:8px;} .term button {padding:4px 6px;}}
</style></head>
<body>
<div class="controls"><label for="speed">Tempo</label><select id="speed"><option value="1">Normalt</option><option value="0.8">Långsamt</option></select><button id="stop" type="button">Stoppa ljud</button></div>
<p class="status" id="status" role="status" aria-live="polite"></p><div id="content"></div>
<script>
const data = __SPEECH_DATA__;
const synth = window.speechSynthesis;
const status = document.getElementById('status');
const buttons = [];
let currentUtterance = null;
let currentPlayer = null;
function recorded(text,lang) {return (data.clips || {})[(lang || '') + '\n' + text];}
function stopAll() {
  currentUtterance = null;
  if (synth) synth.cancel();
  if (currentPlayer) {currentPlayer.pause(); currentPlayer.currentTime = 0; currentPlayer = null;}
}
// Enhetens röster varierar mycket i kvalitet. Vi poängsätter dem och väljer den mest naturliga:
// neurala/"Natural"-röster (Edge), Googles nätröster (Chrome, Chromebook), Apples förbättrade röster.
// Gamla lokala röster (t.ex. Microsoft Sabina/Helena) och eSpeak låter robotiska och väljs sist.
const LATIN_AMERICA = /[-_](mx|us|419|cl|ar|co|pe|uy|ve|ec|bo|cr|do|gt|hn|ni|pa|py|sv|pr)$/i;
const NOVELTY = /\b(albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox)\b/i;
function voiceScore(v, tag) {
  const name = v.name || '';
  let score = 0;
  if (/natural|neural/i.test(name)) score += 100;
  if (/premium|enhanced|förbättrad|siri/i.test(name)) score += 70;
  if (/online/i.test(name) || /^google/i.test(name) || v.localService === false) score += 60;
  if (/espeak|compact|robot/i.test(name) || NOVELTY.test(name)) score -= 100;
  const lang = v.lang.toLowerCase().replace('_', '-');
  if (tag.toLowerCase().startsWith('es') && LATIN_AMERICA.test(lang)) score += 30;
  if (lang === tag.toLowerCase()) score += 10;
  if (v.default) score += 2;
  return score;
}
function voiceFor(tag) {
  if (!tag || !synth) return null;
  const prefix = tag.toLowerCase().split('-')[0];
  const candidates = synth.getVoices().filter(v => v.lang.toLowerCase().split(/[-_]/)[0] === prefix);
  if (!candidates.length) return null;
  return candidates.map(v => [voiceScore(v, tag), v]).sort((a, b) => b[0] - a[0])[0][1];
}
function refreshVoices() {
  buttons.forEach(({button,lang,text}) => {button.disabled = !recorded(text,lang) && !voiceFor(lang);});
  if (Object.keys(data.clips || {}).length) status.textContent = 'Sparade AI-röster används där ljud finns. Övriga ord använder enhetens röst.';
  else if (!synth) status.textContent = 'Uppläsning stöds inte i denna webbläsare. Du kan fortfarande läsa och öva glosorna.';
  else if (!data.language) status.textContent = 'Uppläsning saknas för detta språk. Läraren kan ange ett språknamn som Spanska eller en språkkod som es-MX.';
  else if (!voiceFor(data.language)) status.textContent = 'Ingen röst för ' + data.label + ' hittades. Prova en annan webbläsare eller aktivera en röst för språket på enheten.';
  else {
    const voice = voiceFor(data.language);
    status.textContent = 'Röst: ' + voice.name + '. Tryck på ett ord för att lyssna.' +
      (voiceScore(voice, data.language) < 60 ? ' Låter rösten robotisk? Prova webbläsaren Edge eller Chrome, som har naturligare röster.' : '');
  }
}
function speak(text,lang) {
  stopAll();
  const clip = recorded(text,lang);
  if (clip) {
    const player = new Audio(clip.src);
    currentPlayer = player;
    player.playbackRate = Number(document.getElementById('speed').value);
    player.preservesPitch = true;
    player.onplaying = () => {if (currentPlayer === player) status.textContent = 'Lyssnar: ' + text;};
    player.onended = () => {if (currentPlayer === player) {currentPlayer=null; status.textContent='Klart. Du kan lyssna igen eller välja ett annat ord.';}};
    const failed = () => {if (currentPlayer === player) {stopAll(); status.textContent='Det sparade ljudet kunde inte spelas. Prova igen.';}};
    player.onerror = failed;
    player.play().catch(failed);
    return;
  }
  const voice = voiceFor(lang);
  if (!voice) {refreshVoices(); return;}
  synth.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  currentUtterance = utterance;
  utterance.voice = voice;
  utterance.lang = voice.lang;
  utterance.rate = Number(document.getElementById('speed').value);
  utterance.onstart = () => {if (currentUtterance === utterance) status.textContent = 'Lyssnar: ' + text;};
  utterance.onend = () => {if (currentUtterance === utterance) {currentUtterance = null; status.textContent = 'Klart. Du kan lyssna igen eller välja ett annat ord.';}};
  utterance.onerror = () => {if (currentUtterance === utterance) {currentUtterance = null; status.textContent = 'Ljudet kunde inte spelas. Försök igen eller prova en annan webbläsare.';}};
  synth.speak(utterance);
}
function term(text,lang,short=false) {
  const wrapper = document.createElement('div'); wrapper.className = 'term';
  const label = document.createElement('span'); label.textContent = text; wrapper.appendChild(label);
  const button = document.createElement('button'); button.type = 'button'; button.textContent = short ? '🔊' : '🔊 Lyssna';
  button.setAttribute('aria-label','Lyssna på ' + text); button.title = 'Lyssna på ' + text;
  button.addEventListener('click',() => speak(text,lang)); wrapper.appendChild(button);
  buttons.push({button,lang,text}); return wrapper;
}
const content = document.getElementById('content');
if (data.table) {
  const table = document.createElement('table');
  const head = table.createTHead().insertRow();
  ['Svenska',data.label].forEach(text => {const th = document.createElement('th'); th.scope='col'; th.textContent=text; head.appendChild(th);});
  const body = table.createTBody();
  data.rows.forEach(word => {const row = body.insertRow(); row.insertCell().appendChild(term(word.svenska,'sv-SE',true)); const target=row.insertCell(); word.target.forEach(text => target.appendChild(term(text,data.language,true)));});
  content.appendChild(table);
} else {
  content.className = 'single';
  data.rows.forEach(word => word.target.forEach(text => content.appendChild(term(text,data.language))));
}
document.getElementById('stop').addEventListener('click',() => {stopAll(); status.textContent='Ljudet är stoppat.';});
window.addEventListener('pagehide',stopAll);
if (synth) synth.addEventListener('voiceschanged',refreshVoices);
refreshVoices();
</script>
</body></html>
