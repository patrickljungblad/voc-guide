name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      # Misslyckade tester visas som felmeddelanden direkt på GitHub, utan att man behöver öppna loggen.
      - run: |
          pytest -q -rf --tb=line > pytest.txt 2>&1 || { grep -E "^(FAILED|ERROR)|^/.*: " pytest.txt | head -10 | sed 's/^/::error::/'; cat pytest.txt; exit 1; }
          cat pytest.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/backend.test.cjs
